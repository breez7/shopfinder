{% if parsed_empty %}
<p class="hint muted-small">파싱된 조건이 없습니다.</p>
{% else %}
<form id="parsed-form" class="parsed-form" data-original='{{ original_json | default("{}") }}'>
    <div class="parsed-row">
        <label>카테고리
            <input type="text" name="category" value="{{ c.category or '' }}">
        </label>
        <label>색상
            <input type="text" name="color" value="{{ c.color or '' }}">
        </label>
        <label>사이즈
            <input type="text" name="size" value="{{ c.size or '' }}">
        </label>
        <label>핏
            <input type="text" name="fit" value="{{ c.fit or '' }}">
        </label>
    </div>
    <div class="parsed-row">
        <label>소재
            <input type="text" name="material" value="{{ c.material or '' }}">
        </label>
        <label>소재 최소 %
            <input type="number" name="material_pct" min="1" max="100" value="{{ c.material_pct or '' }}">
        </label>
        <label>최대 가격 (원)
            <input type="number" name="max_price" min="0" step="1000" value="{{ c.max_price or '' }}">
        </label>
    </div>
    <label class="full">기타 키워드
        <input type="text" name="free_text" value="{{ c.free_text or '' }}">
    </label>
    <div class="parsed-actions">
        <button type="button" id="apply-edits">편집한 조건으로 검색</button>
        <button type="button" id="reset-edits" class="btn-secondary">원래대로</button>
    </div>
</form>
<p class="hint muted-small">파싱 방식: <code>{{ parsed_by }}</code></p>
{% endif %}
