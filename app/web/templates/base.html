<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ShopFinder{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
    <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/htmx-ext-sse@2.2.2" crossorigin="anonymous"></script>
</head>
<body>
<header class="site-header">
    <a href="{{ base_path or '/' }}{% if base_path %}/{% endif %}" class="brand">ShopFinder</a>
    <nav>
        <a href="{{ base_path }}/">검색</a>
        <a href="{{ base_path }}/history">히스토리</a>
        <a href="{{ base_path }}/settings">설정</a>
    </nav>
</header>
<script>window.SHOPFINDER_BASE = "{{ base_path }}";</script>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
