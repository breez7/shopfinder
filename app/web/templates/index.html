{% extends "base.html" %}
{% block content %}
<section class="search">
    <form id="search-form">
        <label for="q" class="visually-hidden">검색어</label>
        <input type="text"
               id="q"
               name="q"
               value="{{ initial_query | default('') }}"
               placeholder="예: 검정 100 사이즈 긴팔 남방 폴리에스테르 80 이상 루즈핏 2만원 이하"
               autocomplete="off"
               autofocus>
        <button type="submit">검색</button>
        <button type="button" id="force-refresh" title="캐시 무시하고 다시 검색">새로고침</button>
    </form>

    <section id="parsed-panel" class="parsed-panel">
        <p class="hint">검색어를 입력하면 파싱된 조건이 여기에 표시됩니다.</p>
    </section>

    <section class="results">
        <div id="loading-banner" class="loading-banner" hidden>
            <span class="spinner" aria-hidden="true"></span>
            <span class="loading-text">검색 중… <span id="loading-phase">조건 파싱 중</span></span>
            <button type="button" id="loading-cancel" class="btn-small">중단</button>
        </div>
        <header class="results-header">
            <div id="shop-status" class="shop-status-list"></div>
            <span class="results-count"><span id="result-count">0</span>개 결과</span>
        </header>
        <div class="results-controls">
            <label class="control">
                정렬:
                <select id="sort-mode">
                    <option value="price_asc">가격 낮은 순</option>
                    <option value="price_desc">가격 높은 순</option>
                    <option value="score_desc">매칭 점수 순</option>
                    <option value="shop">쇼핑몰별</option>
                </select>
            </label>
            <label class="control">
                최대 가격:
                <input type="number" id="max-price-filter" min="0" step="1000" placeholder="(전체)">
            </label>
            <div id="shop-toggles" class="shop-toggles"></div>
        </div>
        <div id="result-grid" class="result-grid"></div>
    </section>
</section>
<script src="{{ url_for('static', path='/js/search.js') }}" defer></script>
{% endblock %}
