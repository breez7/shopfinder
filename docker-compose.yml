services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: shopfinder:latest
    container_name: shopfinder
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      # Override any of these in .env or via `docker compose --env-file`
      SHOPFINDER_HOST: 0.0.0.0
      SHOPFINDER_PORT: "8080"
      SHOPFINDER_DB_PATH: /data/shopfinder.db
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
