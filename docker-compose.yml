services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.playwright
    image: shopfinder:playwright
    container_name: shopfinder
    restart: unless-stopped
    # No host port mapping — Traefik handles ingress on the tesla network.
    expose:
      - "8080"
    volumes:
      - ./data:/data
    # NOTE: basicauth runs inside Traefik (the tesla-proxy-1 container).
    # The .htpasswd file is already mounted there from /home/james/tesla/.htpasswd
    # → /auth/.htpasswd, so the usersfile path in the labels below resolves there.
    environment:
      SHOPFINDER_HOST: 0.0.0.0
      SHOPFINDER_PORT: "8080"
      SHOPFINDER_DB_PATH: /data/shopfinder.db
      # Tells FastAPI it lives at /shopfinder so url_for() / static assets /
      # template links all emit the prefix. Traefik StripPrefix below removes
      # the prefix before forwarding to this container.
      SHOPFINDER_ROOT_PATH: /shopfinder
      ENABLE_PLAYWRIGHT: "1"
      # Force the 4 HTML shop adapters through Playwright (Chromium) so they
      # survive bot-challenge pages and JS-only rendering. Naver uses an API
      # and is unaffected.
      FORCE_JS_ADAPTERS: "coupang,gmarket,eleventh,musinsa"
      # LLM trade-offs on slow z.ai endpoints: skip per-shop keyword
      # optimization and result scoring to keep first-byte latency low.
      # Parse still uses the LLM (one call, max 25s with regex fallback).
      LLM_DISABLE_OPTIMIZE: "1"
      LLM_DISABLE_SCORE: "1"
    # .env carries the LLM_BASE_URL / LLM_API_KEY / LLM_MODEL defaults
    # used when the /settings table is empty. Required when present.
    env_file:
      - path: .env
        required: false
    networks:
      tesla_default:
        ipv4_address: 172.18.0.12
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=tesla_default"
      - "traefik.http.services.shopfinder.loadbalancer.server.port=8080"

      # HTTP -> HTTPS redirect (reuse the 'redirect' middleware defined in
      # the TeslaMate compose; if Traefik doesn't see it, we'll fall back
      # to defining our own.)
      - "traefik.http.middlewares.shopfinder-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.shopfinder-insecure.rule=Host(`james777lee.duckdns.org`) && PathPrefix(`/shopfinder`)"
      - "traefik.http.routers.shopfinder-insecure.entrypoints=web"
      - "traefik.http.routers.shopfinder-insecure.middlewares=shopfinder-redirect"

      # NOTE: no StripPrefix. FastAPI is configured with
      # SHOPFINDER_ROOT_PATH=/shopfinder, so it matches paths with the
      # prefix included. Stripping the prefix at the proxy broke static
      # file routing (StaticFiles is mounted at /static *inside* the app
      # but the app's routing sees /shopfinder/static/... when root_path
      # is set — Mount matching with root_path requires the full path).
      - "traefik.http.routers.shopfinder.rule=Host(`james777lee.duckdns.org`) && PathPrefix(`/shopfinder`)"
      - "traefik.http.routers.shopfinder.entrypoints=websecure"
      - "traefik.http.routers.shopfinder.tls=true"
      - "traefik.http.routers.shopfinder.tls.certresolver=tmhttpchallenge"
      - "traefik.http.routers.shopfinder.service=shopfinder"

networks:
  tesla_default:
    external: true
